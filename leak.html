<!-- leak.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viewdb - Leaks</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background-color: #0f172a;
      font-family: 'Inter', sans-serif;
      color: white;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background-color: #1e293b;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 24px;
      font-weight: 600;
    }
    .categories {
      display: flex;
      gap: 20px;
    }
    .category {
      font-size: 18px;
      color: white;
      text-decoration: none;
      cursor: pointer;
    }
    .category:hover {
      color: #10b981;
    }
    .container {
      flex-grow: 1;
      background-color: #1e293b;
      padding: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      justify-content: center;
    }
    .category-button {
      width: 300px;
      height: 200px;
      background-size: cover;
      background-position: center;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      color: white;
      font-weight: 600;
      border: 2px solid white;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.7);
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
    }
    .category-button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(255, 255, 255, 1);
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Viewdb</div>
    <div class="categories">
      <a href="home.html" class="category">Accueil</a>
      <a href="leak.html" class="category">Leaks</a>
      <a href="contact.html" class="category">Nous contacter</a>
    </div>
  </header>

  <div class="container">
    <h2>Catégories de Leaks</h2>
    <div class="buttons">
      <a href="database.html" class="category-button" style="background-image: url('https://i.pinimg.com/736x/c3/43/22/c343227a5e1bf9010e82f4a462915c80.jpg');">
        Database
      </a>
      <a href="#" class="category-button" style="background-image: url('https://i.pinimg.com/736x/3c/d8/6b/3cd86bf832649cb2cc10238dfa9e8a3e.jpg');">
        Tools
      </a>
      <a href="#" class="category-button" style="background-image: url('https://via.placeholder.com/300x200/0f172a/ffffff?text=Tech');">
        Tech
      </a>
    </div>
  </div>
</body>
</html>
