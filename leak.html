<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viewdb - Database</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background-color: #0f172a;
      font-family: 'Inter', sans-serif;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background-color: #1e293b;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 24px;
      font-weight: 600;
    }
    .categories {
      display: flex;
      gap: 20px;
    }
    .category {
      font-size: 18px;
      color: white;
      text-decoration: none;
    }
    .category:hover {
      color: #10b981;
    }
    .container {
      padding: 40px;
      flex-grow: 1;
    }
    h2 {
      margin-bottom: 30px;
      font-size: 28px;
      font-weight: 600;
    }
    .item {
      background-color: #1e293b;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .item-title {
      font-size: 18px;
      font-weight: 500;
    }
    .item-btn {
      background-color: #10b981;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      color: white;
      font-weight: 600;
      text-decoration: none;
    }
    .item-btn:hover {
      background-color: #059669;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Viewdb</div>
    <div class="categories">
      <a href="home.html" class="category">Accueil</a>
      <a href="leak.html" class="category">Leaks</a>
      <a href="contact.html" class="category">Nous contacter</a>
    </div>
  </header>

  <div class="container">
    <h2>Database Leaks</h2>
    <div class="item">
      <span class="item-title">x1371 Crunchyroll</span>
      <a href="https://gofile.io/d/3utytV" target="_blank" class="item-btn">Télécharger</a>
    </div>
  </div>
</body>
</html>
