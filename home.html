<!-- home.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viewdb - Accueil</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background-color: #0f172a;
      font-family: 'Inter', sans-serif;
      color: white;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background-color: #1e293b;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 24px;
      font-weight: 600;
    }
    .categories {
      display: flex;
      gap: 20px;
    }
    .category {
      font-size: 18px;
      color: white;
      text-decoration: none;
      cursor: pointer;
    }
    .category:hover {
      color: #10b981;
    }
    .container {
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #1e293b;
      flex-direction: column;
      text-align: center;
      padding: 40px;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Viewdb</div>
    <div class="categories">
      <a href="home.html" class="category">Accueil</a>
      <a href="leak.html" class="category">Leaks</a>
      <a href="contact.html" class="category">Nous contacter</a>
    </div>
  </header>

  <div class="container">
    <h2>Bienvenue sur Viewdb</h2>
    <p>Explorez des ressources, outils et contenus exclusifs.</p>
  </div>
</body>
</html>
