<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page d'Accueil</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #0f172a;
      font-family: 'Inter', sans-serif;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background-color: #1e293b;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo {
      font-size: 24px;
      font-weight: 600;
    }
    .logout-button {
      padding: 10px 20px;
      background-color: #10b981;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .logout-button:hover {
      background-color: #059669;
    }
    .container {
      width: 100%;
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .welcome-section {
      text-align: center;
      margin-bottom: 50px;
    }
    .welcome-section h2 {
      font-size: 36px;
      margin-bottom: 20px;
      font-weight: 600;
    }
    .welcome-section p {
      font-size: 18px;
      color: #cbd5e1;
    }
    .dashboard {
      display: flex;
      justify-content: space-between;
      gap: 30px;
      flex-wrap: wrap;
    }
    .card {
      background-color: #334155;
      width: 30%;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
      text-align: center;
      margin-bottom: 20px;
    }
    .card h3 {
      margin-bottom: 15px;
      font-size: 22px;
    }
    .card p {
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Mon Jeu</div>
    <button class="logout-button">Se déconnecter</button>
  </header>
  
  <div class="container">
    <div class="welcome-section">
      <h2>Bienvenue, Utilisateur !</h2>
      <p>Voici un aperçu de votre compte et de votre activité.</p>
    </div>

    <div class="dashboard">
      <div class="card">
        <h3>Mes Statistiques</h3>
        <p>Suivez vos progrès, votre score et vos performances.</p>
      </div>

      <div class="card">
        <h3>Paramètres</h3>
        <p>Gérez votre profil, vos préférences et votre compte.</p>
      </div>

      <div class="card">
        <h3>Mes Jeux</h3>
        <p>Accédez à vos jeux préférés et continuez à jouer.</p>
      </div>
    </div>
  </div>
</body>
</html>
